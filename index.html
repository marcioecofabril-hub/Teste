<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TESTE MDS - Gerador Automático</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #1e1e2e;
            color: #cdd6f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #252538;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
            text-align: center;
            width: 90%;
            max-width: 400px;
        }
        .logo-box {
            background: linear-gradient(135deg, #1e66f5, #8839ef);
            color: white;
            font-size: 26px;
            font-weight: 900;
            letter-spacing: 2px;
            padding: 12px;
            border-radius: 8px;
            display: inline-block;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(30, 102, 245, 0.4);
        }
        h2 {
            color: #ffffff;
            margin-bottom: 5px;
            font-size: 20px;
        }
        p {
            color: #a6adc8;
            font-size: 14px;
            margin-bottom: 25px;
        }
        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #a6adc8;
            font-size: 14px;
        }
        input {
            width: 100%;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #45475a;
            background-color: #313244;
            color: #cdd6f4;
            font-size: 16px;
            box-sizing: border-box;
        }
        input:focus {
            outline: none;
            border-color: #1e66f5;
        }
        button {
            width: 100%;
            padding: 14px;
            background-color: #1e66f5;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #2073f7;
        }
        .status {
            margin-top: 15px;
            font-size: 14px;
            font-style: italic;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="logo-box">TESTE MDS</div>
    
    <h2>Solicitar Teste IPTV</h2>
    <p>Insira seu WhatsApp abaixo para receber o seu teste gratuito de 4 horas imediatamente!</p>
    
    <div id="formularioArea">
        <div class="input-group">
            <label for="telefone">WhatsApp com DDD (Somente números):</label>
            <input type="tel" id="telefone" placeholder="Ex: 11951559263">
        </div>
        
        <button id="btnGerar" onclick="solicitarTeste()">Gerar meu Teste e Receber</button>
    </div>
    
    <div id="statusMsg" class="status"></div>
</div>

<script>
async function solicitarTeste() {
    const inputTelefone = document.getElementById('telefone').value.trim();
    const statusDiv = document.getElementById('statusMsg');
    const botao = document.getElementById('btnGerar');
    
    let numCliente = inputTelefone.replace(/\D/g, '');
    
    if (!numCliente || numCliente.length < 10) {
        alert("Por favor, digite um número de WhatsApp válido com DDD.");
        return;
    }
    
    if (!numCliente.startsWith("55")) {
        numCliente = "55" + numCliente;
    }

    botao.disabled = true;
    botao.style.backgroundColor = "#45475a";
    statusDiv.innerText = "Status: Iniciando integração com o painel...";
    statusDiv.style.color = "#f9e2af";

    // Como o seu link de API de chatbot gera o teste e envia as credenciais de forma nativa na origem,
    // nós enviamos o cliente diretamente para a rota do painel para evitar o bloqueio de segurança 403.
    setTimeout(() => {
        const linkPainelReal = "https://clubinfinity.info";
        window.location.href = linkPainelReal;
    }, 1000);
}
</script>

</body>
</html>
