<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta name="theme-color" content="#071426">

    <title>MDS_TI | Pix gerado</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >
</head>

<body>

    <div class="page">

        <main class="payment-card">

            <header class="brand-header">

                <div class="logo">
                    MDS<span>_TI</span>
                </div>

                <div class="secure-badge">
                    Pagamento seguro
                </div>

            </header>

            <section class="hero">

                <div class="pix-icon">◆</div>

                <p class="eyebrow">
                    PIX GERADO
                </p>

                <h1>
                    R$ {{ amount }}
                </h1>

                <p class="description">
                    Pagamento de serviço de TI
                </p>

            </section>

            <div class="divider"></div>

            <section style="padding: 20px 26px 26px;">

                <p
                    style="
                        margin: 0;
                        color: #475467;
                        text-align: center;
                        font-size: 14px;
                        line-height: 1.5;
                    "
                >
                    Escaneie o QR Code ou utilize o
                    <strong>Pix Copia e Cola</strong>.
                </p>

                <img
                    class="qr"
                    src="data:image/png;base64,{{ qr_base64 }}"
                    alt="QR Code Pix"
                >

                <label
                    for="pix-code"
                    style="
                        display: block;
                        margin: 5px 0 8px;
                        color: #344054;
                        font-size: 13px;
                        font-weight: 650;
                    "
                >
                    Pix Copia e Cola
                </label>

                <textarea
                    id="pix-code"
                    readonly
                >{{ qr_code }}</textarea>

                <button
                    id="copy-button"
                    type="button"
                    onclick="copiarPix()"
                >
                    <span id="copy-button-text">
                        Copiar código Pix
                    </span>

                    <span class="arrow">→</span>
                </button>

                <div
                    id="payment-status"
                    class="pending"
                >
                    Consultando pagamento...
                </div>

                <button
                    id="check-button"
                    type="button"
                    onclick="verificarPagamento(true)"
                    style="
                        margin-top: 12px;
                        background: #071426;
                        box-shadow: none;
                    "
                >
                    Verificar pagamento agora
                </button>

                <div
                    id="approved-details"
                    style="
                        display: none;
                        margin-top: 16px;
                        padding: 16px;
                        border-radius: 12px;
                        background: #ecfdf3;
                        color: #067647;
                        text-align: center;
                    "
                >
                    <strong>
                        Pagamento confirmado
                    </strong>

                    <p
                        id="approved-amount"
                        style="margin: 6px 0 0;"
                    ></p>
                </div>

                <p
                    style="
                        margin: 18px 0 0;
                        color: #98a2b3;
                        text-align: center;
                        font-size: 10px;
                    "
                >
                    Identificação: {{ payment_id }}
                </p>

            </section>

            <footer>

                <strong>MDS_TI</strong>

                <span>
                    Soluções em Tecnologia
                </span>

                <small>
                    Pagamento processado via Mercado Pago
                </small>

            </footer>

        </main>

    </div>

    <script>

        let consultaEmAndamento = false;
        let pagamentoFinalizado = false;


        function copiarPix() {

            const campo =
                document.getElementById("pix-code");

            const textoBotao =
                document.getElementById(
                    "copy-button-text"
                );

            const confirmarCopiaBotao.textContent =
                        "Copiar código Pix";

                }, 2500);
            };


            if (
                navigator.clipboard &&
                window.isSecureContext
            ) {

                navigator.clipboard
                    .writeText(campo.value)
                    .then(confirmarCopia)
                    .catch(function () {

                        copiarModoAlternativo(
                            campo,
                            confirmarCopia
                        );
                    });

            } else {

                copiarModoAlternativo(
                    campo,
                    confirmarCopia
                );
            }
        }


        function copiarModoAlternativo(
            campo,
            callback
        ) {

            campo.focus();
            campo.select();

            campo.setSelectionRange(
                0,
                campo.value.length
            );

            if (document.execCommand("copy")) {
                callback();
            }
        }


        function formatarValor(valor) {

            if (
                valor === null ||
                valor === undefined
            ) {
                return "";
            }

            return Number(valor).toLocaleString(
                "pt-BR",
                {
                    style: "currency",
                    currency: "BRL"
                }
            );
        }


        async function verificarPagamento(manual) {

            if (
                consultaEmAndamento ||
                pagamentoFinalizado
            ) {
                return;
            }

            consultaEmAndamento = true;

            const status =
                document.getElementById(
                    "payment-status"
                );

            const botao =
                document.getElementById(
                    "check-button"
                );

            if (manual) {
                status.textContent =
                    "Atualizando pagamento...";
            }

            try {

                const resposta = await fetch(
                    "/api/status/{{ payment_id }}?t=" +
                    Date.now(),
                    {
                        method: "GET",
                        cache: "no-store",
                        headers: {
                            "Accept": "application/json"
                        }
                    }
                );

                const dados =
                    await resposta.json();

                if (!resposta.ok || !dados.ok) {

                    status.textContent =
                        "Não foi possível consultar agora.";

                    status.className =
                        "error";

                    consultaEmAndamento = false;

                    if (!pagamentoFinalizado) {
                        setTimeout(
                            function () {
                                verificarPagamento(false);
                            },
                            5000
                        );
                    }

                    return;
                }


                if (dados.status === "approved") {

                    pagamentoFinalizado = true;

                    status.textContent =
                        "Pagamento aprovado!";

                    status.className =
                        "approved";

                    botao.style.display =
                        "none";

                    document.getElementById(
                        "approved-details"
                    ).style.display = "block";

                    document.getElementById(
                        "approved-amount"
                    ).textContent =
                        "Valor pago: " +
                        formatarValor(
                            dados.transaction_amount
                        );

                    return;
                }


                if (dados.status === "rejected") {

                    pagamentoFinalizado = true;

                    status.textContent =
                        "Pagamento recusado.";

                    status.className =
                        "error";

                    return;
                }


                if (
                    dados.status === "cancelled" ||
                    dados.status === "refunded"
                ) {

                    pagamentoFinalizado = true;

                    status.textContent =
                        "Pagamento cancelado ou devolvido.";

                    status.className =
                        "error";

                    return;
                }


                status.textContent =
                    "Aguardando pagamento...";

                status.className =
                    "pending";


            } catch (erro) {

                status.textContent =
                    "Falha temporária na consulta.";

                status.className =
                    "error";

            } finally {

                consultaEmAndamento = false;
            }


            if (!pagamentoFinalizado) {

                setTimeout(
                    function () {
                        verificarPagamento(false);
                    },
                    5000
                );
            }
        }


        document.addEventListener(
            "visibilitychange",
            function () {

                if (
                    document.visibilityState ===
                    "visible"
                ) {
                    verificarPagamento(true);
                }
            }
        );


        window.addEventListener(
            "focus",
            function () {
                verificarPagamento(true);
            }
        );


        verificarPagamento(false);

    </script>

</body>

</html>
